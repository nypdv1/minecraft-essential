name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Download and extract Essential jar
        run: |
          mkdir -p lib
          curl -sS "https://api.modrinth.com/v2/project/essential/version?loaders=%5B%22fabric%22%5D&game_versions=%5B%221.20.1%22%5D" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print(d[0]['files'][0]['url'])" \
            | xargs curl -L -o lib/essential-loader.jar
          cd lib
          # Essential loader jar contains the real classes inside a nested jar
          python3 -c "
import zipfile, os
with zipfile.ZipFile('essential-loader.jar') as z:
    for name in z.namelist():
        if name.endswith('.jar') and name.startswith('essential-'):
            print('Extracting', name)
            data = z.read(name)
            with open('essential.mock.jar', 'wb') as f:
                f.write(data)
            break
"
          ls -lh lib/

      - run: mvn clean package -DskipTests
      - uses: actions/upload-artifact@v4
        with:
          name: prometheus
          path: target/prometheus-*.jar
